name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: nix develop . --command bash -lc 'cd plugin && sbt test'

      - name: Run scripted diagnostics test
        run: nix develop . --command bash -lc 'cd plugin && sbt "scripted sbtix/library-diagnostic"'

      - name: Run scripted simple test
        run: nix develop . --command bash -lc 'cd plugin && sbt "scripted sbtix/simple"'

      - name: Run scripted evicted direct POM test
        run: nix develop . --command bash -lc 'cd plugin && sbt "scripted sbtix/evicted-direct-pom"'

      - name: Run scripted relocated POM test
        run: nix develop . --command bash -lc 'cd plugin && sbt "scripted sbtix/relocated-pom"'

      - name: Run scripted private auth test
        run: |
          nix develop . --command bash -lc '
            python3 serve-authenticated.py &
            server=$!
            sleep 1
            if ! kill -0 "$server" 2>/dev/null; then
              echo "auth server failed to start" >&2
              wait "$server"
              exit 1
            fi
            trap "kill $server 2>/dev/null || true" EXIT INT TERM
            cd plugin
            sbt "scripted sbtix/private-auth"
          '

      - name: Run scripted scalafmt test
        run: nix develop . --command bash -lc 'cd plugin && sbt "scripted sbtix/scalafmt"'

      - name: Run scripted Scala 3 test
        run: nix develop . --command bash -lc 'cd plugin && sbt "scripted sbtix/scala3"'

      - name: Run scripted sbt 2 boot jars test
        run: nix develop . --command bash -lc 'cd plugin && sbt "++3.8.4" "scripted sbtix/sbt2-boot-jars"'

      - name: Run scripted sbt 2 native-packager test
        run: nix develop . --command bash -lc 'cd plugin && sbt "++3.8.4" "scripted sbtix/sbt2-native-packager"'

  nix:
    name: Nix build and integration (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whitespace
        run: git diff --check

      - name: Parse Nix templates
        run: nix-instantiate --parse plugin/nix-exprs/sbtix.nix

      - name: Build sbtix
        run: nix build .#sbtix -L

      - name: Run integration tests
        run: |
          nix develop . --command bash -lc '
            set -euo pipefail
            export PATH="$PWD/result/bin:$PATH"
            ./tests/sbt2-cli/run.sh
            ./tests/multi-build/run.sh
            ./tests/template-generation/run.sh
          '
